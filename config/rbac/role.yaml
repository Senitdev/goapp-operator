---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps.senit.dev
  resources:
  - goapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.senit.dev
  resources:
  - goapps/finalizers
  verbs:
  - update
- apiGroups:
  - apps.senit.dev
  resources:
  - goapps/status
  verbs:
  - get
  - patch
  - update
